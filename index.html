<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CS2 Case Simulator</title>
<style>
:root{
  --bg:#0d0f14; --panel:#161a22; --panel2:#1d222c; --line:#2a303c; --text:#e8ebf1; --muted:#8b93a3;
  --accent:#ff7a1a; --good:#3ddc84; --bad:#ff5a5a;
  --milspec:#4b69ff; --restricted:#8847ff; --classified:#d32ce6; --covert:#eb4b4b; --gold:#e4ae39;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;display:flex;flex-direction:column}
button{font:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
  padding:10px 18px;background:rgba(13,15,20,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.logo{font-weight:800;letter-spacing:.08em;font-size:18px}
.logo span{color:var(--accent)}
nav{display:flex;gap:6px}
nav button{background:transparent;color:var(--muted);border:1px solid transparent;padding:8px 14px;border-radius:8px}
nav button.active{color:var(--text);background:var(--panel2);border-color:var(--line)}
.right{display:flex;gap:10px;align-items:center}
.balance{background:var(--panel2);border:1px solid var(--line);padding:7px 14px;border-radius:8px;font-weight:700;color:var(--good)}
.chip{background:var(--panel);border:1px solid var(--line);padding:7px 12px;border-radius:8px;color:var(--muted);font-size:14px}
.icon{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 10px}
main{flex:1;width:100%;max-width:1200px;margin:0 auto;padding:22px 18px 40px}
h2{margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center;
  transition:transform .15s,border-color .15s}
.card.click{cursor:pointer}
.card.click:hover{transform:translateY(-3px);border-color:var(--accent)}
.card img{width:100%;height:130px;object-fit:contain}
.card .name{font-weight:600;margin:8px 0 4px;font-size:15px}
.price{color:var(--good);font-weight:700}
.free-badge{display:inline-block;background:var(--accent);color:#111;font-weight:800;font-size:11px;padding:2px 8px;border-radius:99px;margin-bottom:4px}
.free-img{height:130px;display:flex;align-items:center;justify-content:center;font-size:64px}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 18px;border-radius:9px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#111;border-color:var(--accent)}
.btn.sell{background:var(--good);color:#06210f;border-color:var(--good)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{padding:6px 10px;font-size:13px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px}
/* Roulette */
.roulette{position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 0;margin:14px 0}
.roulette::before,.roulette::after{content:"";position:absolute;top:0;bottom:0;width:90px;z-index:2;pointer-events:none}
.roulette::before{left:0;background:linear-gradient(90deg,var(--panel),transparent)}
.roulette::after{right:0;background:linear-gradient(270deg,var(--panel),transparent)}
.pointer{position:absolute;left:50%;top:0;bottom:0;width:3px;background:var(--accent);z-index:3;transform:translateX(-50%);box-shadow:0 0 12px var(--accent)}
.track{display:flex;will-change:transform}
.rcard{flex:none;width:140px;margin-right:8px;background:var(--panel2);border-radius:8px;padding:8px;text-align:center;border-bottom:4px solid var(--c)}
.rcard img{width:100%;height:84px;object-fit:contain}
.rcard .n{font-size:11px;color:var(--muted);height:28px;overflow:hidden}
.controls{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:22px}
.tier-head{display:flex;align-items:baseline;gap:10px;margin:22px 0 10px;padding-left:10px;border-left:4px solid var(--c)}
.tier-head b{color:var(--c)}
.tier-head span{color:var(--muted);font-size:13px}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.item{background:var(--panel);border:1px solid var(--line);border-bottom:3px solid var(--c);border-radius:10px;padding:10px;text-align:center}
.item img{width:100%;height:88px;object-fit:contain}
.item .n{font-size:12.5px;margin-top:4px}
.item .w{font-size:11.5px;color:var(--muted);margin-top:2px}
.item.inv{border:1px solid var(--c);box-shadow:inset 0 -3px 0 var(--c)}
.item .row{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:6px}
/* Modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.show{display:flex}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px;max-width:420px;width:100%;text-align:center}
.box img{width:100%;max-height:200px;object-fit:contain}
.box input{width:100%;padding:11px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);margin:12px 0;font-size:16px}
.box .actions{display:flex;gap:10px;justify-content:center;margin-top:16px}
.rarity-line{font-weight:700;color:var(--c)}
/* Leaderboard */
#lb{position:fixed;left:14px;bottom:14px;width:240px;background:rgba(22,26,34,.96);border:1px solid var(--line);border-radius:12px;padding:10px 12px;z-index:15}
#lb h4{margin:0 0 6px;font-size:13px;letter-spacing:.06em;color:var(--muted)}
#lb table{width:100%;border-collapse:collapse;font-size:13px}
#lb td{padding:3px 2px}
#lb td:last-child{text-align:right;color:var(--good)}
#lb tr.me td{color:var(--accent);font-weight:700}
#lb .own{margin-top:6px;font-size:12px;color:var(--muted)}
footer{padding:16px;text-align:center;color:var(--muted);font-size:12.5px;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--accent);padding:10px 18px;border-radius:10px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.center{text-align:center;padding:60px 10px;color:var(--muted)}
@media (min-width:901px){ main{padding-bottom:190px} }
@media (max-width:900px){
  #lb{position:static;width:auto;margin:0 18px 18px;border-radius:12px}
  .rcard{width:110px}
  .rcard img{height:64px}
}
</style>
</head>
<body>
<header>
  <div class="logo">CASE<span>SIM</span></div>
  <nav>
    <button data-action="nav" data-view="cases" id="navCases">Cases</button>
    <button data-action="nav" data-view="inventory" id="navInv">Inventar</button>
  </nav>
  <div class="right">
    <span class="chip" id="nameChip" data-action="rename" style="cursor:pointer" title="Namen ändern"></span>
    <button class="icon" id="muteBtn" data-action="mute" title="Sound an/aus">🔊</button>
    <div class="balance" id="balance">$0,00</div>
  </div>
</header>

<main id="view"><div class="center">Lade Case-Daten …</div></main>

<aside id="lb">
  <h4>🏆 TOP 3</h4>
  <table><tbody id="lbBody"><tr><td>…</td></tr></tbody></table>
  <div class="own" id="lbOwn"></div>
</aside>

<footer>Reiner Simulator mit virtuellem Geld, nicht mit Valve verbunden.</footer>

<!-- Namens-Dialog -->
<div class="modal" id="nameModal">
  <div class="box">
    <h2>Willkommen!</h2>
    <p class="sub">Wähle einen Spielernamen für die Rangliste.</p>
    <input id="nameInput" maxlength="16" placeholder="Dein Name" autocomplete="off">
    <button class="btn primary" data-action="savename">Los geht's</button>
  </div>
</div>

<!-- Ergebnis-Dialog -->
<div class="modal" id="resultModal">
  <div class="box" id="resultBox"></div>
</div>

<div class="toast" id="toast"></div>
<noscript><p style="padding:20px">Diese Seite braucht JavaScript.</p></noscript>

<script>
"use strict";
/* ==========================================================================
   KONFIGURATION – hier kannst du alles zentral ändern
   ========================================================================== */
const CONFIG = {
  currency: "$",                 // Nur Fake-Währung
  startBalance: 0,

  // Kostenloser Case: zieht aus dem Item-Pool eines echten Cases (poolFrom).
  // Cooldown in Stunden (zum Testen z. B. 0.02 = ca. 1 Minute).
  freeCase: { name: "Free Case", poolFrom: "Danger Zone Case", cooldownHours: 24 },

  // Preise = Fake-Preise, grob "Case + Schlüssel". Namen müssen exakt den echten Case-Namen entsprechen.
  cases: [
    { name: "Kilowatt Case",              price: 3.50 },
    { name: "Revolution Case",            price: 3.20 },
    { name: "Recoil Case",                price: 3.10 },
    { name: "Dreams & Nightmares Case",   price: 3.10 },
    { name: "Fracture Case",              price: 3.10 },
    { name: "Snakebite Case",             price: 3.00 },
    { name: "Prisma 2 Case",              price: 3.20 },
    { name: "Prisma Case",                price: 3.40 },
    { name: "CS20 Case",                  price: 3.30 },
    { name: "Danger Zone Case",           price: 3.10 },
    { name: "Clutch Case",                price: 3.20 },
    { name: "Spectrum 2 Case",            price: 3.60 },
    { name: "Horizon Case",               price: 3.20 },
    { name: "Glove Case",                 price: 5.50 },
    { name: "Chroma 3 Case",              price: 5.00 },
    { name: "Gamma 2 Case",               price: 5.00 }
  ],

  // Echte Drop-Chancen in % (Summe = 100)
  odds: { milspec: 79.92, restricted: 15.98, classified: 3.20, covert: 0.64, gold: 0.26 },
  stattrakChance: 0.10,          // 10 % wie im echten Spiel
  stattrakMultiplier: 1.6,

  // Fake-Verkaufspreise: [min, max] je Seltenheit (Basis, wird je Skin gestreut) ...
  priceRanges: {
    milspec:[0.08,0.60], restricted:[0.40,2.50], classified:[1.50,9], covert:[6,45], gold:[150,1800]
  },
  // ... und mit der Abnutzung multipliziert
  wearMultiplier: { "Factory New":1.5, "Minimal Wear":1.0, "Field-Tested":0.75, "Well-Worn":0.6, "Battle-Scarred":0.5 },

  rouletteMs: 6500,

  // Rangliste: Standard = lokal. Für eine echte, gemeinsame Rangliste siehe SupabaseLeaderboard unten.
  supabase: { url: "", anonKey: "", table: "leaderboard" },

  // Datenquelle (öffentlich, kostenlos)
  api: {
    base: "https://raw.githubusercontent.com/ByMykel/CSGO-API/main/public/api/en/",
    cacheDays: 7
  }
};

const TIERS = [
  { key: "milspec",    label: "Mil-Spec",                 color: "#4b69ff" },
  { key: "restricted", label: "Restricted",               color: "#8847ff" },
  { key: "classified", label: "Classified",               color: "#d32ce6" },
  { key: "covert",     label: "Covert",                   color: "#eb4b4b" },
  { key: "gold",       label: "Seltener Spezialgegenstand (Messer/Handschuhe)", color: "#e4ae39" }
];
const TIER = Object.fromEntries(TIERS.map(t => [t.key, t]));

/* ==========================================================================
   Hilfsfunktionen
   ========================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const round2 = n => Math.round(n * 100) / 100;
const money = n => CONFIG.currency + Number(n).toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const imgTag = url => `<img src="${esc(url)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">`;
function hash01(str) { // deterministische Zahl 0..1 pro Item-ID
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return ((h >>> 0) % 100000) / 100000;
}
let toastTimer;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

/* ==========================================================================
   Spielstand (localStorage)
   ========================================================================== */
const KEY = "cs2sim_state_v1";
function defaultState() {
  return {
    playerId: (crypto.randomUUID ? crypto.randomUUID() : "p" + Date.now() + Math.random().toString(16).slice(2)),
    name: "", balance: CONFIG.startBalance, inventory: [], lastFree: 0, pending: null, muted: false
  };
}
let state = (() => {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) return Object.assign(defaultState(), s); } catch (e) {}
  return defaultState();
})();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  updateHeader(); scheduleLeaderboard();
}
const totalValue = () => round2(state.balance + state.inventory.reduce((s, i) => s + i.price, 0));

/* ==========================================================================
   Rangliste – ein Interface, zwei Implementierungen
   ========================================================================== */
// Interface: async top(n) -> [{id,name,total}] ; async submit({id,name,total})

// a) Standard: lokal + simulierte Spieler, damit die Liste nicht leer ist
class LocalLeaderboard {
  constructor() {
    this.bots = [
      { id: "bot1", name: "Ace_Hunter",    total: 2840.50 },
      { id: "bot2", name: "NovaFrag",      total: 1210.20 },
      { id: "bot3", name: "KnifeEnjoyer",  total: 640.80 },
      { id: "bot4", name: "CaseGoblin",    total: 310.40 },
      { id: "bot5", name: "SilentPeek",    total: 95.00 }
    ];
  }
  async top(n) {
    let me = null;
    try { me = JSON.parse(localStorage.getItem("cs2sim_lb_me")); } catch (e) {}
    const rows = this.bots.concat(me ? [me] : []);
    return rows.sort((a, b) => b.total - a.total).slice(0, n);
  }
  async submit(entry) { try { localStorage.setItem("cs2sim_lb_me", JSON.stringify(entry)); } catch (e) {} }
}

// b) Echtes Backend mit Supabase (kostenloser Plan reicht). Was du dafür tun musst:
//   1. Auf supabase.com ein Projekt anlegen.
//   2. Im SQL-Editor ausführen:
//        create table leaderboard (
//          player_id text primary key,
//          name text not null,
//          total numeric not null default 0,
//          updated_at timestamptz default now()
//        );
//        alter table leaderboard enable row level security;
//        create policy "lesen"      on leaderboard for select using (true);
//        create policy "einfuegen"  on leaderboard for insert with check (true);
//        create policy "aendern"    on leaderboard for update using (true);
//   3. Unter Project Settings -> API die "Project URL" und den "anon public key" in CONFIG.supabase eintragen.
//   Achtung: Weil der Spielstand im Browser liegt, kann ein Nutzer seinen Wert theoretisch manipulieren.
//   Für eine "echte" Rangliste müsste die Logik auf einen Server (z. B. Supabase Edge Functions).
class SupabaseLeaderboard {
  constructor(cfg) { this.cfg = cfg; }
  get h() { return { apikey: this.cfg.anonKey, Authorization: "Bearer " + this.cfg.anonKey }; }
  async top(n) {
    const r = await fetch(`${this.cfg.url}/rest/v1/${this.cfg.table}?select=player_id,name,total&order=total.desc&limit=${n}`, { headers: this.h });
    if (!r.ok) throw new Error("Rangliste nicht erreichbar");
    return (await r.json()).map(x => ({ id: x.player_id, name: x.name, total: Number(x.total) }));
  }
  async submit(e) {
    await fetch(`${this.cfg.url}/rest/v1/${this.cfg.table}?on_conflict=player_id`, {
      method: "POST",
      headers: { ...this.h, "Content-Type": "application/json", Prefer: "resolution=merge-duplicates" },
      body: JSON.stringify([{ player_id: e.id, name: e.name, total: e.total }])
    });
  }
}

const leaderboard = (CONFIG.supabase.url && CONFIG.supabase.anonKey)
  ? new SupabaseLeaderboard(CONFIG.supabase) : new LocalLeaderboard();

let lbTimer;
function scheduleLeaderboard() { clearTimeout(lbTimer); lbTimer = setTimeout(refreshLeaderboard, 400); }
async function refreshLeaderboard() {
  if (!state.name) return;
  try {
    await leaderboard.submit({ id: state.playerId, name: state.name, total: totalValue() });
    const rows = await leaderboard.top(3);
    $("#lbBody").innerHTML = rows.map((r, i) =>
      `<tr class="${r.id === state.playerId ? "me" : ""}"><td>${["🥇","🥈","🥉"][i]}</td><td>${esc(r.name)}</td><td>${money(r.total)}</td></tr>`).join("")
      || "<tr><td>Noch leer</td></tr>";
  } catch (e) { $("#lbBody").innerHTML = "<tr><td>Rangliste offline</td></tr>"; }
  $("#lbOwn").textContent = "Dein Gesamtwert: " + money(totalValue());
}

/* ==========================================================================
   Daten laden (echte Case-Inhalte aus der ByMykel/CSGO-API)
   ========================================================================== */
let CASES = [];   // [{name,image,price,free?,items:{tier:[{id,name,image,min,max}]}}]

function tierOf(rarity) {
  const n = ((rarity && rarity.name) || "").toLowerCase();
  if (n.includes("covert")) return "covert";
  if (n.includes("classified")) return "classified";
  if (n.includes("restricted")) return "restricted";
  return "milspec";
}
async function fetchJson(file) {
  const r = await fetch(CONFIG.api.base + file);
  if (!r.ok) throw new Error(file + ": HTTP " + r.status);
  return r.json();
}
const cacheSig = () => JSON.stringify([CONFIG.cases.map(c => c.name), CONFIG.freeCase.poolFrom]);

async function loadData() {
  // Cache, damit die großen JSON-Dateien nicht bei jedem Besuch geladen werden müssen
  try {
    const c = JSON.parse(localStorage.getItem("cs2sim_data_v1"));
    if (c && c.sig === cacheSig() && Date.now() - c.ts < CONFIG.api.cacheDays * 864e5) return c.data;
  } catch (e) {}

  const [crates, skins] = await Promise.all([fetchJson("crates.json"), fetchJson("skins.json")]);
  const floats = {};
  for (const s of skins) floats[s.id] = [s.min_float, s.max_float];
  const findCase = name => crates.find(c => c.name.toLowerCase() === name.toLowerCase() && (!c.type || c.type === "Case"))
                        || crates.find(c => c.name.toLowerCase() === name.toLowerCase());

  const compact = it => {
    const f = floats[it.id];
    const hasPattern = (it.name || "").includes(" | ");
    return { id: it.id, name: it.name, image: it.image,
      min: f ? f[0] : (hasPattern ? 0 : null), max: f ? f[1] : (hasPattern ? 1 : null) };
  };
  const build = crate => {
    const items = { milspec: [], restricted: [], classified: [], covert: [], gold: [] };
    for (const it of crate.contains || []) items[tierOf(it.rarity)].push(compact(it));
    for (const it of crate.contains_rare || []) items.gold.push(compact(it));
    return items;
  };

  const out = { cases: [], freeItems: null };
  for (const cc of CONFIG.cases) {
    const crate = findCase(cc.name);
    if (!crate) { console.warn("Case nicht in der API gefunden:", cc.name); continue; }
    out.cases.push({ name: crate.name, image: crate.image, price: cc.price, items: build(crate) });
  }
  const pool = findCase(CONFIG.freeCase.poolFrom);
  if (pool) out.freeItems = build(pool);
  try { localStorage.setItem("cs2sim_data_v1", JSON.stringify({ sig: cacheSig(), ts: Date.now(), data: out })); } catch (e) {}
  return out;
}

/* ==========================================================================
   Drop-Logik
   ========================================================================== */
const WEARS = [["Factory New", 0.07], ["Minimal Wear", 0.15], ["Field-Tested", 0.38], ["Well-Worn", 0.45], ["Battle-Scarred", 1.01]];
const wearName = f => WEARS.find(w => f < w[1])[0];

function rollTier(c) {
  const avail = TIERS.filter(t => c.items[t.key].length);          // leere Seltenheiten fallen raus, Rest wird normiert
  const sum = avail.reduce((s, t) => s + CONFIG.odds[t.key], 0);
  let r = Math.random() * sum;
  for (const t of avail) { r -= CONFIG.odds[t.key]; if (r < 0) return t.key; }
  return avail[avail.length - 1].key;
}
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

function itemPrice(base, tier, wear, stattrak) {
  const [lo, hi] = CONFIG.priceRanges[tier];
  const h = hash01(base.id);
  let p = lo + (hi - lo) * h * h;                                   // Skin-spezifisch, eher günstig verteilt
  if (wear) p *= CONFIG.wearMultiplier[wear];
  if (stattrak) p *= CONFIG.stattrakMultiplier;
  return Math.max(0.03, round2(p));
}
function fullName(d) {
  const st = d.stattrak ? "StatTrak™ " : "";
  const n = d.name.startsWith("★ ") ? "★ " + st + d.name.slice(2) : st + d.name;
  return d.wear ? `${n} (${d.wear})` : n;
}
function makeDrop(c) {
  const tier = rollTier(c);
  const base = pick(c.items[tier]);
  const hasWear = base.min != null;
  const fl = hasWear ? base.min + Math.random() * (base.max - base.min) : null;
  const wear = hasWear ? wearName(fl) : null;
  const stattrak = Math.random() < CONFIG.stattrakChance;
  return {
    uid: "d" + Date.now() + Math.random().toString(16).slice(2, 8),
    id: base.id, name: base.name, image: base.image, tier, wear,
    float: fl == null ? null : Number(fl.toFixed(6)), stattrak,
    price: itemPrice(base, tier, wear, stattrak), ts: Date.now()
  };
}

/* ==========================================================================
   Sound (optional, WebAudio – keine Dateien nötig)
   ========================================================================== */
let audioCtx = null;
function beep(freq, dur = 0.05, vol = 0.04, type = "square", delay = 0) {
  if (state.muted) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t = audioCtx.currentTime + delay;
    o.type = type; o.frequency.value = freq; g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t + dur);
  } catch (e) {}
}
function winSound(tier) {
  const n = { milspec: 2, restricted: 3, classified: 4, covert: 5, gold: 7 }[tier];
  for (let i = 0; i < n; i++) beep(440 * Math.pow(1.25, i), 0.18, 0.05, "triangle", i * 0.09);
}

/* ==========================================================================
   Ansichten
   ========================================================================== */
let view = "cases", currentCase = null, busy = false;

function freeRemaining() {
  return Math.max(0, state.lastFree + CONFIG.freeCase.cooldownHours * 3600e3 - Date.now());
}
function fmtTime(ms) {
  const s = Math.ceil(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return [h, m, x].map(v => String(v).padStart(2, "0")).join(":");
}
function freeCaseObj() {
  return { name: CONFIG.freeCase.name, price: 0, free: true, image: null, items: DATA.freeItems };
}

function updateHeader() {
  $("#balance").textContent = money(state.balance);
  $("#nameChip").textContent = "👤 " + (state.name || "…");
  $("#muteBtn").textContent = state.muted ? "🔇" : "🔊";
  $("#navCases").classList.toggle("active", view !== "inventory");
  $("#navInv").classList.toggle("active", view === "inventory");
  $("#navInv").textContent = "Inventar (" + state.inventory.length + ")";
}

function render() {
  updateHeader();
  if (view === "inventory") renderInventory();
  else if (view === "case" && currentCase) renderCase(currentCase);
  else renderCases();
  window.scrollTo(0, 0);
}

function renderCases() {
  view = "cases"; updateHeader();
  const free = DATA.freeItems ? `
    <div class="card click" data-action="opencase" data-case="__free">
      <span class="free-badge">KOSTENLOS</span>
      <div class="free-img">🎁</div>
      <div class="name">${esc(CONFIG.freeCase.name)}</div>
      <div class="price" data-free-label></div>
    </div>` : "";
  $("#view").innerHTML = `
    <h2>Cases</h2>
    <p class="sub">Echte CS2-Cases mit den echten Inhalten und Drop-Chancen. Alles mit Fake-Geld.</p>
    <div class="grid">${free}${CASES.map((c, i) => `
      <div class="card click" data-action="opencase" data-case="${i}">
        ${imgTag(c.image)}
        <div class="name">${esc(c.name)}</div>
        <div class="price">${money(c.price)}</div>
      </div>`).join("")}</div>`;
  refreshFree();
}

function cardHTML(d) {
  return `<div class="rcard" style="--c:${TIER[d.tier].color}">${imgTag(d.image)}<div class="n">${esc(d.name)}</div></div>`;
}
function randomDisplay(c) {
  const tier = rollTier(c), base = pick(c.items[tier]);
  return { name: base.name, image: base.image, tier };
}

function renderCase(c) {
  view = "case"; currentCase = c; updateHeader();
  const previews = Array.from({ length: 24 }, () => cardHTML(randomDisplay(c))).join("");
  const sections = TIERS.filter(t => c.items[t.key].length).map(t => {
    const list = c.items[t.key], each = CONFIG.odds[t.key] / list.length;
    return `
      <div class="tier-head" style="--c:${t.color}"><b>${t.label}</b>
        <span>${CONFIG.odds[t.key].toFixed(2).replace(".", ",")} % gesamt · ca. ${each.toFixed(3).replace(".", ",")} % pro Item</span></div>
      <div class="igrid">${list.map(it => `
        <div class="item" style="--c:${t.color}">${imgTag(it.image)}<div class="n">${esc(it.name)}</div></div>`).join("")}</div>`;
  }).join("");
  $("#view").innerHTML = `
    <button class="btn small" data-action="back">← Zurück</button>
    <h2 style="margin-top:14px">${esc(c.name)}</h2>
    <p class="sub">${c.free ? "Kostenlos – einmal pro " + CONFIG.freeCase.cooldownHours + " Stunden" : "Preis: " + money(c.price)}
       · Chancen: Blau 79,92 % · Lila 15,98 % · Pink 3,20 % · Rot 0,64 % · Gold 0,26 %</p>
    <div class="roulette"><div class="pointer"></div><div class="track" id="track">${previews}</div></div>
    <div class="controls">
      <button class="btn primary" id="openBtn" data-action="open"></button>
      <label><input type="checkbox" id="fast"> Schnell (ohne Animation)</label>
    </div>
    <h3>Mögliche Items</h3>${sections}`;
  refreshFree();
}

function renderInventory() {
  view = "inventory"; updateHeader();
  const f = window._invFilter || "all", s = window._invSort || "new";
  let list = state.inventory.filter(i => f === "all" || i.tier === f);
  const order = { milspec: 0, restricted: 1, classified: 2, covert: 3, gold: 4 };
  list.sort((a, b) =>
    s === "high" ? b.price - a.price :
    s === "low"  ? a.price - b.price :
    s === "rarity" ? order[b.tier] - order[a.tier] || b.price - a.price :
    b.ts - a.ts);
  const sum = round2(list.reduce((x, i) => x + i.price, 0));
  $("#view").innerHTML = `
    <h2>Inventar</h2>
    <p class="sub">${state.inventory.length} Items · Gesamtwert ${money(state.inventory.reduce((x, i) => x + i.price, 0))}</p>
    <div class="toolbar">
      <select id="invFilter"><option value="all">Alle Seltenheiten</option>
        ${TIERS.map(t => `<option value="${t.key}" ${f === t.key ? "selected" : ""}>${t.key === "gold" ? "Messer/Handschuhe" : t.label}</option>`).join("")}</select>
      <select id="invSort">
        <option value="new" ${s === "new" ? "selected" : ""}>Neueste zuerst</option>
        <option value="high" ${s === "high" ? "selected" : ""}>Wert absteigend</option>
        <option value="low" ${s === "low" ? "selected" : ""}>Wert aufsteigend</option>
        <option value="rarity" ${s === "rarity" ? "selected" : ""}>Seltenheit</option></select>
      <button class="btn sell small" data-action="sellall" ${list.length ? "" : "disabled"}>Alle angezeigten verkaufen (${money(sum)})</button>
    </div>
    ${list.length ? `<div class="igrid" style="grid-template-columns:repeat(auto-fill,minmax(190px,1fr))">${list.map(i => `
      <div class="item inv" style="--c:${TIER[i.tier].color}">
        ${imgTag(i.image)}
        <div class="n">${esc(fullName(i))}</div>
        <div class="w">${i.float != null ? "Float " + i.float.toFixed(4) : "Vanilla"}</div>
        <div class="row"><span class="price">${money(i.price)}</span>
          <button class="btn sell small" data-action="sell" data-uid="${esc(i.uid)}">Verkaufen</button></div>
      </div>`).join("")}</div>` : `<div class="center">Hier ist noch nichts. Öffne Cases und behalte die besten Items!</div>`}`;
  $("#invFilter").onchange = e => { window._invFilter = e.target.value; renderInventory(); };
  $("#invSort").onchange = e => { window._invSort = e.target.value; renderInventory(); };
}

/* Kostenlos-Case-Countdown */
function refreshFree() {
  const rem = freeRemaining();
  document.querySelectorAll("[data-free-label]").forEach(el => el.textContent = rem ? "Bereit in " + fmtTime(rem) : "Jetzt öffnen!");
  const b = $("#openBtn");
  if (b && currentCase && view === "case" && !busy) {
    if (currentCase.free) { b.disabled = rem > 0; b.textContent = rem ? "Bereit in " + fmtTime(rem) : "Kostenlos öffnen"; }
    else { b.disabled = state.balance + 1e-9 < currentCase.price; b.textContent = "Öffnen – " + money(currentCase.price); }
  }
}
setInterval(refreshFree, 1000);

/* ==========================================================================
   Case öffnen
   ========================================================================== */
function spin(c, drop, fast) {
  return new Promise(resolve => {
    const track = $("#track"), vp = track.parentElement;
    const N = 70, W = 58;
    track.innerHTML = Array.from({ length: N }, (_, i) => cardHTML(i === W ? drop : randomDisplay(c))).join("");
    track.style.transform = "translateX(0)";
    const vw = vp.clientWidth;
    const CARD = track.children[1].offsetLeft - track.children[0].offsetLeft;
    const jitter = (Math.random() - 0.5) * CARD * 0.7;
    const target = -(W * CARD + CARD / 2 + jitter) + vw / 2;
    const dur = fast ? 700 : CONFIG.rouletteMs, t0 = performance.now();
    let last = -1;
    (function frame(now) {
      const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 4), x = target * e;
      track.style.transform = `translateX(${x}px)`;
      const idx = Math.floor((-x + vw / 2) / CARD);
      if (idx !== last) { last = idx; if (!fast) beep(560 + (idx % 3) * 50, 0.04, 0.03); }
      if (p < 1) requestAnimationFrame(frame); else resolve();
    })(t0);
  });
}

async function doOpen() {
  if (busy || !currentCase) return;
  const c = currentCase;
  if (c.free) { if (freeRemaining() > 0) return toast("Der kostenlose Case ist noch im Cooldown."); }
  else if (state.balance + 1e-9 < c.price) return toast("Nicht genug Guthaben.");
  busy = true; $("#openBtn").disabled = true;
  if (c.free) state.lastFree = Date.now(); else state.balance = round2(state.balance - c.price);
  const drop = makeDrop(c);
  state.pending = drop;           // falls die Seite während der Animation neu geladen wird, geht nichts verloren
  save();
  await spin(c, drop, $("#fast").checked);
  showResult(drop);
  busy = false;
}

function showResult(d) {
  const col = TIER[d.tier].color;
  $("#resultBox").innerHTML = `
    <div class="rarity-line" style="--c:${col}">${d.tier === "gold" ? "Seltener Spezialgegenstand" : TIER[d.tier].label}</div>
    ${imgTag(d.image)}
    <h3 style="margin:8px 0 4px">${esc(fullName(d))}</h3>
    <div class="sub" style="margin:0">${d.float != null ? "Float " + d.float.toFixed(6) : "Vanilla"}</div>
    <div class="price" style="font-size:22px;margin-top:8px">${money(d.price)}</div>
    <div class="actions">
      <button class="btn sell" data-action="rsell">Verkaufen</button>
      <button class="btn" data-action="rkeep">Behalten</button>
    </div>`;
  $("#resultBox").style.boxShadow = `0 0 40px ${col}55`;
  $("#resultBox").style.borderColor = col;
  $("#resultModal").classList.add("show");
  winSound(d.tier);
}
function closeResult(sell) {
  const d = state.pending; if (!d) return;
  if (sell) { state.balance = round2(state.balance + d.price); toast("Verkauft für " + money(d.price)); }
  else { state.inventory.push(d); toast("Ins Inventar gelegt"); }
  state.pending = null; save();
  $("#resultModal").classList.remove("show");
  if (view === "case") refreshFree();
  if (view === "inventory") renderInventory();
}

/* ==========================================================================
   Events (Delegation)
   ========================================================================== */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]"); if (!el) return;
  const a = el.dataset.action;
  if (busy && ["nav", "back", "opencase"].includes(a)) return;
  switch (a) {
    case "nav": view = el.dataset.view; render(); break;
    case "back": view = "cases"; render(); break;
    case "opencase": renderCase(el.dataset.case === "__free" ? freeCaseObj() : CASES[+el.dataset.case]); window.scrollTo(0, 0); break;
    case "open": doOpen(); break;
    case "sell": {
      const i = state.inventory.findIndex(x => x.uid === el.dataset.uid);
      if (i > -1) { state.balance = round2(state.balance + state.inventory[i].price); state.inventory.splice(i, 1); save(); renderInventory(); }
      break;
    }
    case "sellall": {
      const f = window._invFilter || "all";
      const sel = state.inventory.filter(i => f === "all" || i.tier === f);
      if (!sel.length || !confirm(sel.length + " Items verkaufen?")) break;
      state.balance = round2(state.balance + sel.reduce((s, i) => s + i.price, 0));
      state.inventory = state.inventory.filter(i => !sel.includes(i));
      save(); renderInventory(); break;
    }
    case "rsell": closeResult(true); break;
    case "rkeep": closeResult(false); break;
    case "mute": state.muted = !state.muted; save(); break;
    case "rename": $("#nameInput").value = state.name; $("#nameModal").classList.add("show"); $("#nameInput").focus(); break;
    case "savename": {
      const n = $("#nameInput").value.trim().slice(0, 16);
      if (!n) return toast("Bitte einen Namen eingeben.");
      state.name = n; save(); $("#nameModal").classList.remove("show"); break;
    }
    case "retry": init(); break;
  }
});
$("#nameInput").addEventListener("keydown", e => { if (e.key === "Enter") document.querySelector('[data-action="savename"]').click(); });

/* ==========================================================================
   Start
   ========================================================================== */
let DATA = null;
async function init() {
  $("#view").innerHTML = `<div class="center">Lade Case-Daten …</div>`;
  try {
    DATA = await loadData();
    CASES = DATA.cases;
    if (!CASES.length) throw new Error("Keine Cases gefunden");
  } catch (err) {
    console.error(err);
    $("#view").innerHTML = `<div class="center">Die Case-Daten konnten nicht geladen werden (${esc(err.message)}).<br>
      Prüfe deine Internetverbindung.<br><br><button class="btn primary" data-action="retry">Erneut versuchen</button></div>`;
    return;
  }
  render();
  if (!state.name) $("#nameModal").classList.add("show");
  else refreshLeaderboard();
  if (state.pending) showResult(state.pending);   // unterbrochene Öffnung wiederherstellen
}
updateHeader();
init();
</script>
