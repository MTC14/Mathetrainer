<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CS2 Case Simulator</title>
<style>
:root{
  --bg:#0d0f14; --panel:#161a22; --panel2:#1d222c; --line:#2a303c; --text:#e8ebf1; --muted:#8b93a3;
  --accent:#ff7a1a; --good:#3ddc84; --bad:#ff5a5a;
  --milspec:#4b69ff; --restricted:#8847ff; --classified:#d32ce6; --covert:#eb4b4b; --gold:#e4ae39;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;display:flex;flex-direction:column}
button{font:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
  padding:10px 18px;background:rgba(13,15,20,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.logo{font-weight:800;letter-spacing:.08em;font-size:18px}
.logo span{color:var(--accent)}
nav{display:flex;gap:6px}
nav button{background:transparent;color:var(--muted);border:1px solid transparent;padding:8px 14px;border-radius:8px}
nav button.active{color:var(--text);background:var(--panel2);border-color:var(--line)}
.right{display:flex;gap:10px;align-items:center}
.balance{background:var(--panel2);border:1px solid var(--line);padding:7px 14px;border-radius:8px;font-weight:700;color:var(--good)}
.chip{background:var(--panel);border:1px solid var(--line);padding:7px 12px;border-radius:8px;color:var(--muted);font-size:14px}
.icon{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 10px}
main{flex:1;width:100%;max-width:1200px;margin:0 auto;padding:22px 18px 40px}
h2{margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center;
  transition:transform .15s,border-color .15s}
.card.click{cursor:pointer}
.card.click:hover{transform:translateY(-3px);border-color:var(--accent)}
.card img{width:100%;height:130px;object-fit:contain}
.card .name{font-weight:600;margin:8px 0 4px;font-size:15px}
.price{color:var(--good);font-weight:700}
.free-badge{display:inline-block;background:var(--accent);color:#111;font-weight:800;font-size:11px;padding:2px 8px;border-radius:99px;margin-bottom:4px}
.free-img{height:130px;display:flex;align-items:center;justify-content:center;font-size:64px}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 18px;border-radius:9px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#111;border-color:var(--accent)}
.btn.sell{background:var(--good);color:#06210f;border-color:var(--good)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{padding:6px 10px;font-size:13px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px}
.group-head{display:flex;align-items:baseline;gap:12px;margin:30px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.group-head b{font-size:17px}
.group-head span{color:var(--muted);font-size:13px}
.group-head.first{margin-top:6px}
/* Roulette */
.roulette{position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 0;margin:14px 0}
.roulette::before,.roulette::after{content:"";position:absolute;top:0;bottom:0;width:90px;z-index:2;pointer-events:none}
.roulette::before{left:0;background:linear-gradient(90deg,var(--panel),transparent)}
.roulette::after{right:0;background:linear-gradient(270deg,var(--panel),transparent)}
.pointer{position:absolute;left:50%;top:0;bottom:0;width:3px;background:var(--accent);z-index:3;transform:translateX(-50%);box-shadow:0 0 12px var(--accent)}
.track{display:flex;will-change:transform}
.rcard{flex:none;width:140px;margin-right:8px;background:var(--panel2);border-radius:8px;padding:8px;text-align:center;border-bottom:4px solid var(--c)}
.rcard img{width:100%;height:84px;object-fit:contain}
.rcard .n{font-size:11px;color:var(--muted);height:28px;overflow:hidden}
.controls{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:22px}
.tier-head{display:flex;align-items:baseline;gap:10px;margin:22px 0 10px;padding-left:10px;border-left:4px solid var(--c)}
.tier-head b{color:var(--c)}
.tier-head span{color:var(--muted);font-size:13px}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.item{background:var(--panel);border:1px solid var(--line);border-bottom:3px solid var(--c);border-radius:10px;padding:10px;text-align:center}
.item img{width:100%;height:88px;object-fit:contain}
.item .n{font-size:12.5px;margin-top:4px}
.item .w{font-size:11.5px;color:var(--muted);margin-top:2px}
.item.inv{border:1px solid var(--c);box-shadow:inset 0 -3px 0 var(--c)}
.item .row{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:6px}
/* Modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.show{display:flex}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px;max-width:420px;width:100%;text-align:center}
.box img{width:100%;max-height:200px;object-fit:contain}
.box input{width:100%;padding:11px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);margin:12px 0;font-size:16px}
.box .actions{display:flex;gap:10px;justify-content:center;margin-top:16px}
.rarity-line{font-weight:700;color:var(--c)}
/* Leaderboard */
#lb{position:fixed;left:14px;bottom:14px;width:240px;background:rgba(22,26,34,.96);border:1px solid var(--line);border-radius:12px;padding:10px 12px;z-index:15}
#lb h4{margin:0 0 6px;font-size:13px;letter-spacing:.06em;color:var(--muted)}
#lb table{width:100%;border-collapse:collapse;font-size:13px}
#lb td{padding:3px 2px}
#lb td:last-child{text-align:right;color:var(--good)}
#lb tr.me td{color:var(--accent);font-weight:700}
#lb .own{margin-top:6px;font-size:12px;color:var(--muted)}
footer{padding:16px;text-align:center;color:var(--muted);font-size:12.5px;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--accent);padding:10px 18px;border-radius:10px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.center{text-align:center;padding:60px 10px;color:var(--muted)}
@media (min-width:901px){ main{padding-bottom:190px} }
@media (max-width:900px){
  #lb{position:static;width:auto;margin:0 18px 18px;border-radius:12px}
  .rcard{width:110px}
  .rcard img{height:64px}
}

/* Neue Bereiche */
#lb .lb-status{font-size:11px;color:var(--muted);margin-top:5px}
.upgrade-layout{display:grid;grid-template-columns:minmax(180px,1fr) minmax(230px,330px) minmax(180px,1fr);gap:18px;align-items:center;margin:20px 0}
.upgrade-pick{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;min-height:270px}
.upgrade-pick img{height:150px;width:100%;object-fit:contain}
.wheel{width:min(270px,70vw);aspect-ratio:1;border-radius:50%;margin:auto;display:grid;place-items:center;position:relative;background:conic-gradient(#42d77d 0 25%,#f4c543 45%,#ed5a3d 70%,#282d37 88%,#42d77d);box-shadow:0 0 34px #f27a1a33;transition:transform 4.6s cubic-bezier(.12,.7,.12,1)}
.wheel:after{content:"";position:absolute;z-index:2;top:-8px;left:calc(50% - 10px);border-left:10px solid transparent;border-right:10px solid transparent;border-top:0;border-bottom:22px solid #fff;filter:drop-shadow(0 1px 5px #000)}
.wheel:before{content:"";position:absolute;inset:13px;background:radial-gradient(circle,#242a34,#101319 70%);border:5px solid #3a414e;border-radius:50%}
.wheel-center{z-index:1;text-align:center}.wheel-center strong{font-size:34px;color:#ffd36a;display:block}.wheel-center span{font-size:12px;color:var(--muted)}
.upgrade-columns{display:grid;grid-template-columns:1fr 1fr;gap:18px}.upgrade-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:9px;max-height:410px;overflow:auto}
.pick-card{cursor:pointer}.pick-card.selected{outline:2px solid var(--accent)}
.inspect{max-width:1050px;width:100%;padding:0;overflow:hidden;text-align:left;background:#111923}.inspect-scene{min-height:70vh;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:radial-gradient(ellipse at 50% 55%,#66715b 0,#38463b 28%,#212a2b 61%,#111720 100%)}
.inspect-scene:before{content:"";position:absolute;inset:0;background:linear-gradient(125deg,transparent 35%,#ffffff12 50%,transparent 65%),repeating-linear-gradient(0deg,transparent 0 70px,#0002 71px 73px);filter:blur(2px)}
.inspect-title,.inspect-image,.inspect-details,.inspect-close{position:relative;z-index:1}.inspect-title{font-size:clamp(20px,3vw,34px);border-bottom:4px solid #d3444b;padding:0 10px 8px;text-align:center}.inspect-image{width:min(75%,760px);height:min(50vh,430px);object-fit:contain;filter:drop-shadow(0 22px 24px #0009)}.inspect-details{position:absolute;bottom:18px;left:20px;right:20px;background:#10151ddc;padding:12px 16px;border-radius:10px;display:flex;gap:10px 22px;flex-wrap:wrap;font-size:13px}.inspect-close{position:absolute;right:14px;top:14px}
#panicScreen{display:none;position:fixed;inset:0;z-index:99999;background:#fff;color:#252525;font-family:Arial,sans-serif;padding:8vh max(7vw,20px)}body.panic>*:not(#panicScreen){display:none!important}body.panic #panicScreen{display:block!important}
.panic-panel{max-width:650px;margin:0 auto}.panic-panel h1{font-size:32px;font-weight:400;margin:0 0 18px}.panic-label{font-size:14px;color:#777;margin-bottom:12px}.panic-input{width:100%;height:50px;border:2px solid #79c5ff;border-radius:4px;box-shadow:0 0 4px #1684cf;padding:10px;font-size:18px}.panic-submit{display:block;margin:24px auto;background:#0873b9;border:0;color:#fff;padding:12px 42px;border-radius:28px;font-size:16px}.panic-error{color:#b32d2d;text-align:center;min-height:22px}
@media(max-width:850px){.upgrade-layout{grid-template-columns:1fr}.wheel{grid-row:2}.upgrade-pick{min-height:0}.inspect-scene{min-height:80vh}.inspect-image{width:90%;height:45vh}.inspect-details{position:relative;bottom:auto;left:auto;right:auto;margin-top:8px}.upgrade-columns{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="logo">CASE<span>SIM</span></div>
  <nav>
    <button data-action="nav" data-view="cases" id="navCases">Cases</button>
    <button data-action="nav" data-view="inventory" id="navInv">Inventar</button>
    <button data-action="nav" data-view="upgrader" id="navUpgrade">Upgrader</button>
    <button data-action="nav" data-view="leaderboard" id="navLeaderboard">Rangliste</button>
  </nav>
  <div class="right">
    <span class="chip" id="nameChip" data-action="rename" style="cursor:pointer" title="Namen ändern"></span>
    <button class="icon" id="panicBtn" data-action="panic" title="Tarnansicht">•</button>
    <button class="icon" id="muteBtn" data-action="mute" title="Sound an/aus">🔊</button>
    <div class="balance" id="balance">$0,00</div>
  </div>
</header>

<main id="view"><div class="center">Lade Case-Daten …</div></main>

<aside id="lb">
  <h4>🏆 TOP 3</h4>
  <table><tbody id="lbBody"><tr><td>…</td></tr></tbody></table>
  <div class="own" id="lbOwn"></div><div class="lb-status" id="lbStatus">Globale Rangliste nicht verbunden</div>
</aside>

<footer>Reiner Simulator mit virtuellem Geld, nicht mit Valve verbunden.</footer>

<!-- Namens-Dialog -->
<div class="modal" id="nameModal">
  <div class="box">
    <h2>Willkommen!</h2>
    <p class="sub">Wähle einen Spielernamen für die Rangliste.</p>
    <input id="nameInput" maxlength="16" placeholder="Dein Name" autocomplete="off">
    <button class="btn primary" data-action="savename">Los geht's</button>
  </div>
</div>

<!-- Ergebnis-Dialog -->
<div class="modal" id="resultModal">
  <div class="box" id="resultBox"></div>
</div>

<div class="toast" id="toast"></div>
<div class="modal" id="inspectModal" aria-modal="true" role="dialog"><div class="box inspect" id="inspectBox"></div></div>
<div id="panicScreen"><div class="panic-panel"><h1>Freischaltcode eintragen <span style="color:#087bc1">❔</span></h1><div class="panic-label">♟ &nbsp;Lokale Freischaltung</div><form id="panicForm"><input class="panic-input" id="panicCode" autocomplete="off" aria-label="Freischaltcode"><button class="panic-submit">Jetzt freischalten</button><div id="panicError" class="panic-error"></div></form></div></div>
<noscript><p style="padding:20px">Diese Seite braucht JavaScript.</p></noscript>

<script>
"use strict";
/* ==========================================================================
   KONFIGURATION – hier kannst du alles zentral ändern
   ========================================================================== */
const CONFIG = {
  currency: "$",                 // Nur Fake-Währung
  startBalance: 0,

  // Kostenloser Case: UNBEGRENZT oft öffenbar, zieht aber NUR Mil-Spec (blau)
  // aus dem Item-Pool eines echten Cases (poolFrom).
  freeCase: { name: "Free Case", poolFrom: "Danger Zone Case" },

  // Fake-Preise. Die Liste wird automatisch nach Preis sortiert (günstig oben, teuer unten),
  // du musst die Reihenfolge also nie von Hand pflegen. Namen müssen den echten Case-Namen entsprechen;
  // fehlt einer in der Datenquelle, wird er übersprungen und auf der Startseite aufgelistet.
  // Optional pro Case: mult: 2  -> eigener Wert-Multiplikator statt der automatischen Berechnung.
  cases: [
    // Einsteiger
    { name: "Recoil Case",                price: 0.50 },
    { name: "Dreams & Nightmares Case",   price: 0.55 },
    { name: "Fracture Case",              price: 0.60 },
    { name: "Snakebite Case",             price: 0.65 },
    { name: "Revolver Case",              price: 0.70 },
    { name: "Revolution Case",            price: 0.80 },
    // Mittelklasse
    { name: "Prisma 2 Case",              price: 1.10 },
    { name: "CS20 Case",                  price: 1.20 },
    { name: "Danger Zone Case",           price: 1.30 },
    { name: "Prisma Case",                price: 1.40 },
    { name: "Clutch Case",                price: 1.50 },
    { name: "Horizon Case",               price: 1.60 },
    { name: "Kilowatt Case",              price: 1.80 },
    { name: "Operation Riptide Case",     price: 2.00 },
    { name: "Shattered Web Case",         price: 2.20 },
    { name: "Operation Broken Fang Case", price: 2.40 },
    // Premium
    { name: "Spectrum 2 Case",            price: 2.80 },
    { name: "Spectrum Case",              price: 3.20 },
    { name: "Gamma 2 Case",               price: 3.60 },
    { name: "Gamma Case",                 price: 4.00 },
    { name: "Chroma 2 Case",              price: 4.40 },
    { name: "Chroma Case",                price: 4.80 },
    { name: "Chroma 3 Case",              price: 5.20 },
    { name: "Glove Case",                 price: 5.80 },
    // High Roller
    { name: "Falchion Case",              price: 7.00 },
    { name: "Shadow Case",                price: 8.00 },
    { name: "Operation Hydra Case",       price: 10.00 },
    { name: "Operation Wildfire Case",    price: 12.00 },
    { name: "Operation Breakout Weapon Case", price: 18.00 }
  ],

  // Überschriften auf der Startseite (nach Preis, max = obere Grenze)
  groups: [
    { label: "Einsteiger",   max: 1.00 },
    { label: "Mittelklasse", max: 2.50 },
    { label: "Premium",      max: 6.00 },
    { label: "High Roller",  max: Infinity }
  ],

  // WERT-MULTIPLIKATOR: Die Verkaufspreise aller Items eines Cases werden so skaliert, dass der
  // erwartete Rückgewinn ca. targetReturn (80 %) des Case-Preises beträgt. Teure Cases haben also
  // wertvollere Items, im Schnitt zahlt man aber etwas drauf – mit Jackpot-Chance durch Messer/Handschuhe.
  // 1.0 wäre "fair", über 1.0 wäre ein Gewinn-Case. Pro Case überschreibbar (siehe mult oben).
  targetReturn: 0.80,

  // Echte Drop-Chancen in % (Summe = 100)
  odds: { milspec: 79.92, restricted: 15.98, classified: 3.20, covert: 0.64, gold: 0.26 },
  stattrakChance: 0.10,          // 10 % wie im echten Spiel
  stattrakMultiplier: 1.6,

  // Fake-Basispreise (vor Wear und Case-Multiplikator): [min, max] je Seltenheit, pro Skin gestreut.
  // Blaue Skins sind bewusst sehr günstig.
  priceRanges: {
    milspec:[0.02,0.30], restricted:[0.20,1.50], classified:[0.80,6], covert:[3,30], gold:[25,300]
  },
  // ... und mit der Abnutzung multipliziert
  wearMultiplier: { "Factory New":1.5, "Minimal Wear":1.0, "Field-Tested":0.75, "Well-Worn":0.6, "Battle-Scarred":0.5 },

  rouletteMs: 6500,

  // Nur ein serverseitiger Edge Function-Endpunkt darf Ranglistenwerte schreiben.
  // Leerlassen, bis die mitgelieferte Supabase-Lösung installiert wurde.
  supabase: { url: "", anonKey: "", functionName: "leaderboard" },

  // Datenquelle (öffentlich, kostenlos)
  api: {
    base: "https://raw.githubusercontent.com/ByMykel/CSGO-API/main/public/api/en/",
    cacheDays: 7
  }
};

const TIERS = [
  { key: "milspec",    label: "Mil-Spec",                 color: "#4b69ff" },
  { key: "restricted", label: "Restricted",               color: "#8847ff" },
  { key: "classified", label: "Classified",               color: "#d32ce6" },
  { key: "covert",     label: "Covert",                   color: "#eb4b4b" },
  { key: "gold",       label: "Seltener Spezialgegenstand (Messer/Handschuhe)", color: "#e4ae39" }
];
const TIER = Object.fromEntries(TIERS.map(t => [t.key, t]));

/* ==========================================================================
   Hilfsfunktionen
   ========================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const round2 = n => Math.round(n * 100) / 100;
const money = n => CONFIG.currency + Number(n).toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const imgTag = url => `<img src="${esc(url)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">`;
function hash01(str) { // deterministische Zahl 0..1 pro Item-ID
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return ((h >>> 0) % 100000) / 100000;
}
let toastTimer;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

/* ==========================================================================
   Spielstand (localStorage)
   ========================================================================== */
const KEY = "cs2sim_state_v1";
function defaultState() {
  return {
    playerId: (crypto.randomUUID ? crypto.randomUUID() : "p" + Date.now() + Math.random().toString(16).slice(2)),
    name: "", balance: CONFIG.startBalance, inventory: [], pending: null, muted: false, fast: false, autoSell: false
  };
}
let state = (() => {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) return Object.assign(defaultState(), s); } catch (e) {}
  return defaultState();
})();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  updateHeader(); scheduleLeaderboard();
}
const totalValue = () => round2(state.balance + state.inventory.reduce((s, i) => s + i.price, 0));

/* ==========================================================================
   Rangliste – ein Interface, zwei Implementierungen
   ========================================================================== */
// Interface: async top(n) -> [{id,name,total}] ; async submit({id,name,total})

// Ohne serverseitige Funktion werden keine Teilnehmer vorgetäuscht.
class SupabaseLeaderboard {
  constructor(cfg) { this.cfg = cfg; }
  get headers() { return { apikey: this.cfg.anonKey, Authorization: "Bearer " + this.cfg.anonKey, "Content-Type": "application/json" }; }
  async top(n) {
    const r = await fetch(`${this.cfg.url}/rest/v1/leaderboard?select=player_id,name,total&order=total.desc&limit=${n}`, { headers: this.headers });
    if (!r.ok) throw new Error("Rangliste nicht erreichbar");
    return (await r.json()).map(x => ({ id:x.player_id, name:x.name, total:Number(x.total) }));
  }
  async session() {
    const key="cs2sim_supabase_session"; let session=null;
    try { session=JSON.parse(localStorage.getItem(key)); } catch(e) {}
    if (!session || !session.access_token || (session.expires_at||0)*1000 < Date.now()+60000) {
      if (session?.refresh_token) {
        const rr=await fetch(`${this.cfg.url}/auth/v1/token?grant_type=refresh_token`,{method:"POST",headers:{apikey:this.cfg.anonKey,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:session.refresh_token})});
        if(rr.ok){const d=await rr.json();session={...d,expires_at:Math.floor(Date.now()/1000)+(d.expires_in||3600)};}
        else session=null;
      }
      if (!session || !session.access_token) {
        const r=await fetch(`${this.cfg.url}/auth/v1/signup`,{method:"POST",headers:{apikey:this.cfg.anonKey,"Content-Type":"application/json"},body:"{}"});
        if (!r.ok) throw new Error("Anonyme Supabase-Anmeldung fehlgeschlagen");
        const d=await r.json(); session={...d,expires_at:Math.floor(Date.now()/1000)+(d.expires_in||3600)};
      }
      localStorage.setItem(key,JSON.stringify(session));
    }

    return session;
  }
  async submit(e) {

    const r = await fetch(`${this.cfg.url}/functions/v1/${this.cfg.functionName}`, { method:"POST", headers:{...this.headers,Authorization:"Bearer "+session.access_token}, body:JSON.stringify({...e,id:session.user?.id || e.id}) });
    if (!r.ok) throw new Error("Server konnte den Rang nicht aktualisieren");
  }
}

/* ==========================================================================
   Daten laden (echte Case-Inhalte aus der ByMykel/CSGO-API)
   ========================================================================== */
let CASES = [];   // [{name,image,price,free?,items:{tier:[{id,name,image,min,max}]}}]

function tierOf(rarity) {
  const n = ((rarity && rarity.name) || "").toLowerCase();
  if (n.includes("covert")) return "covert";
  if (n.includes("classified")) return "classified";
  if (n.includes("restricted")) return "restricted";
  return "milspec";
}
async function fetchJson(file) {
  const r = await fetch(CONFIG.api.base + file);
  if (!r.ok) throw new Error(file + ": HTTP " + r.status);
  return r.json();
}
const cacheSig = () => JSON.stringify([CONFIG.cases.map(c => c.name), CONFIG.freeCase.poolFrom]);

async function loadData() {
  // Cache, damit die großen JSON-Dateien nicht bei jedem Besuch geladen werden müssen.
  // (Preise stehen nicht im Cache, die kommen immer frisch aus CONFIG.)
  try {
    const c = JSON.parse(localStorage.getItem("cs2sim_data_v2"));
    if (c && c.sig === cacheSig() && Date.now() - c.ts < CONFIG.api.cacheDays * 864e5) return c.data;
  } catch (e) {}

  const [crates, skins] = await Promise.all([fetchJson("crates.json"), fetchJson("skins.json")]);
  const floats = {};
  for (const s of skins) floats[s.id] = [s.min_float, s.max_float];
  const findCase = name => crates.find(c => c.name.toLowerCase() === name.toLowerCase() && (!c.type || c.type === "Case"))
                        || crates.find(c => c.name.toLowerCase() === name.toLowerCase());

  const compact = it => {
    const f = floats[it.id];
    const hasPattern = (it.name || "").includes(" | ");
    return { id: it.id, name: it.name, image: it.image,
      min: f ? f[0] : (hasPattern ? 0 : null), max: f ? f[1] : (hasPattern ? 1 : null) };
  };
  const build = crate => {
    const items = { milspec: [], restricted: [], classified: [], covert: [], gold: [] };
    for (const it of crate.contains || []) items[tierOf(it.rarity)].push(compact(it));
    for (const it of crate.contains_rare || []) items.gold.push(compact(it));
    return items;
  };

  const out = { cases: [], freeItems: null, missing: [], catalog: [] };
  for (const cc of CONFIG.cases) {
    const crate = findCase(cc.name);
    if (!crate) { console.warn("Case nicht in der API gefunden:", cc.name); out.missing.push(cc.name); continue; }
    out.cases.push({ key: cc.name, name: crate.name, image: crate.image, items: build(crate) });
  }
  const allSkins = { milspec: [], restricted: [], classified: [], covert: [], gold: [] };
  for (const crate of crates.filter(x => x.type === "Case" || !x.type)) {
    for (const it of crate.contains || []) allSkins[tierOf(it.rarity)].push(compact(it));
    for (const it of crate.contains_rare || []) allSkins.gold.push(compact(it));
  }
  const seen = new Set();
  for (const tier of Object.keys(allSkins)) for (const skin of allSkins[tier]) if (!seen.has(skin.id)) { seen.add(skin.id); out.catalog.push({...skin,tier}); }
  // Free Case: nur der Mil-Spec-Pool, alle anderen Seltenheiten bleiben leer
  const pool = findCase(CONFIG.freeCase.poolFrom);
  if (pool) {
    const all = build(pool);
    if (all.milspec.length) out.freeItems = { milspec: all.milspec, restricted: [], classified: [], covert: [], gold: [] };
  }
  try { localStorage.setItem("cs2sim_data_v2", JSON.stringify({ sig: cacheSig(), ts: Date.now(), data: out })); } catch (e) {}
  return out;
}

/* ==========================================================================
   Drop-Logik
   ========================================================================== */
const WEARS = [["Factory New", 0.07], ["Minimal Wear", 0.15], ["Field-Tested", 0.38], ["Well-Worn", 0.45], ["Battle-Scarred", 1.01]];
const wearName = f => WEARS.find(w => f < w[1])[0];

// Tatsächliche Chancen eines Cases in %: leere Seltenheiten fallen weg, der Rest wird auf 100 % normiert.
// Beim Free Case bleibt dadurch nur Mil-Spec mit 100 % übrig.
function tierOdds(c) {
  const avail = TIERS.filter(t => c.items[t.key].length);
  const sum = avail.reduce((s, t) => s + CONFIG.odds[t.key], 0);
  const o = {};
  for (const t of avail) o[t.key] = CONFIG.odds[t.key] / sum * 100;
  return o;
}
function rollTier(c) {
  const o = tierOdds(c);
  let r = Math.random() * 100, last = null;
  for (const t of TIERS) {
    if (o[t.key] == null) continue;
    last = t.key; r -= o[t.key];
    if (r < 0) return t.key;
  }
  return last;
}
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

function itemPrice(base, tier, wear, stattrak, mult) {
  const [lo, hi] = CONFIG.priceRanges[tier];
  const h = hash01(base.id);
  let p = lo + (hi - lo) * h * h;                                   // Skin-spezifisch, eher günstig verteilt
  if (wear) p *= CONFIG.wearMultiplier[wear];
  if (stattrak) p *= CONFIG.stattrakMultiplier;
  p *= mult;                                                        // Wert-Multiplikator des Cases
  return Math.max(0.01, round2(p));
}

// Erwartete Abnutzungs-Multiplikation über den Float-Bereich eines Skins
function wearFactor(min, max) {
  if (min == null) return 1;
  if (max <= min) return CONFIG.wearMultiplier[wearName(min)];
  let e = 0, lo = 0;
  for (const [n, hi] of WEARS) {
    const a = Math.max(lo, min), b = Math.min(hi, max);
    if (b > a) e += (b - a) / (max - min) * CONFIG.wearMultiplier[n];
    lo = hi;
  }
  return e;
}
// Erwarteter Wert eines Case-Öffnens bei Multiplikator 1 (aus den echten Item-Listen und Chancen)
function expectedValue(items) {
  const odds = tierOdds({ items });
  const st = 1 + CONFIG.stattrakChance * (CONFIG.stattrakMultiplier - 1);
  let ev = 0;
  for (const t of TIERS) {
    const list = items[t.key];
    if (!list.length) continue;
    const [lo, hi] = CONFIG.priceRanges[t.key];
    let sum = 0;
    for (const b of list) { const h = hash01(b.id); sum += (lo + (hi - lo) * h * h) * wearFactor(b.min, b.max) * st; }
    ev += odds[t.key] / 100 * sum / list.length;
  }
  return ev;
}
// Cases aus Rohdaten + Preisen bauen, Multiplikator berechnen, nach Preis sortieren
function buildCases(data) {
  return data.cases.map(c => {
    const cfg = CONFIG.cases.find(x => x.name === c.key);
    const ev = expectedValue(c.items);
    return { ...c, price: cfg.price, mult: cfg.mult ?? (ev > 0 ? cfg.price * CONFIG.targetReturn / ev : 1) };
  }).sort((a, b) => a.price - b.price);
}
const groupOf = p => CONFIG.groups.find(g => p <= g.max) || CONFIG.groups[CONFIG.groups.length - 1];
function fullName(d) {
  const st = d.stattrak ? "StatTrak™ " : "";
  const n = d.name.startsWith("★ ") ? "★ " + st + d.name.slice(2) : st + d.name;
  return d.wear ? `${n} (${d.wear})` : n;
}
function makeDrop(c) {
  const tier = rollTier(c);
  const base = pick(c.items[tier]);
  const hasWear = base.min != null;
  const fl = hasWear ? base.min + Math.random() * (base.max - base.min) : null;
  const wear = hasWear ? wearName(fl) : null;
  const stattrak = Math.random() < CONFIG.stattrakChance;
  return {
    uid: "d" + Date.now() + Math.random().toString(16).slice(2, 8),
    id: base.id, name: base.name, image: base.image, tier, wear,
    float: fl == null ? null : Number(fl.toFixed(6)), stattrak,
    price: itemPrice(base, tier, wear, stattrak, c.mult || 1), ts: Date.now()
  };
}

/* ==========================================================================
   Sound (optional, WebAudio – keine Dateien nötig)
   ========================================================================== */
let audioCtx = null;
function beep(freq, dur = 0.05, vol = 0.04, type = "square", delay = 0) {
  if (state.muted) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t = audioCtx.currentTime + delay;
    o.type = type; o.frequency.value = freq; g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t + dur);
  } catch (e) {}
}
function winSound(tier) {
  const n = { milspec: 2, restricted: 3, classified: 4, covert: 5, gold: 7 }[tier];
  for (let i = 0; i < n; i++) beep(440 * Math.pow(1.25, i), 0.18, 0.05, "triangle", i * 0.09);
}

  $("#upgradeSearch").oninput=filter;$("#upgradePrice").onchange=filter;$("#upgradeTier").onchange=filter;
}
function upgradeCard(d,sel,action){return `<div class="item pick-card ${sel?"selected":""}" style="--c:${rarityTier(d.tier).color}" data-action="${action}" data-uid="${esc(d.uid)}">${imgTag(d.image)}<div class=n>${esc(fullName(d))}</div><div class=w>${money(d.price)}</div></div>`;}
async function runUpgrade(){
  if(upgradeBusy||busy)return;const source=state.inventory.find(x=>x.uid===upFrom),target=upgradeCatalog().find(x=>x.uid===upTo);if(!source||!target||target.price<=source.price)return toast("Ziel muss wertvoller sein.");
  upgradeBusy=true; const win=crypto.getRandomValues(new Uint32Array(1))[0]/4294967296 < source.price/target.price*.95;const chance=source.price/target.price*.95*100;
  const wheel=$("#upgradeWheel"),msg=$("#upgradeMessage");$("[data-action=upgrade]").disabled=true;wheel.style.background=`conic-gradient(#42d77d 0 ${chance}%,#ed5a3d ${chance}% 100%)`;
  // Ergebnis wird vor der Animation festgelegt; die sichtbare Markierung endet auf diesem Ergebnis.
  const span=chance*3.6;const chosen=win?span*(0.18+Math.random()*0.64):span+(360-span)*(0.18+Math.random()*0.64);wheel.style.transform=`rotate(${1440+360-chosen}deg)`;
  msg.textContent="Dreht sich …"; await new Promise(r=>setTimeout(r,4700));
  const idx=state.inventory.findIndex(x=>x.uid===source.uid);if(idx<0){upgradeBusy=false;return renderUpgrader();}
  state.inventory.splice(idx,1);if(win)state.inventory.push({...target,uid:"u"+crypto.randomUUID(),ts:Date.now()});save();upgradeBusy=false;upFrom=null;upTo=null;toast(win?"Upgrade erfolgreich: "+fullName(target):"Upgrade fehlgeschlagen – Einsatz verloren");renderUpgrader();
}
function renderLeaderboard(){view="leaderboard";updateHeader();refreshLeaderboard().then(()=>{const rows=window._leaderboardRows||[];$("#view").innerHTML=`<h2>Globale Rangliste</h2><p class=sub>Top 100 Spieler nach virtuellem Kontostand plus Inventarwert.</p>${!leaderboard?'<div class="center">Backend nicht verbunden. Es werden keine erfundenen Spieler angezeigt.</div>':`<div class=toolbar>Dein Platz: ${rows.findIndex(r=>r.id===state.playerId)+1||"—"}</div><div class=igrid>${rows.map((r,i)=>`<div class=item><b>#${i+1} ${esc(r.name)}</b><div class=w>${money(r.total)} ${r.id===state.playerId?"· Du":""}</div></div>`).join("")}</div>`}`;});}

/* Zustand des Öffnen-Buttons (Guthaben reicht / Free Case) */
function refreshBtn() {
  const b = $("#openBtn");
  if (!b || !currentCase || view !== "case" || busy) return;
  if (currentCase.free) { b.disabled = false; b.textContent = "Kostenlos öffnen"; }
  else { b.disabled = state.balance + 1e-9 < currentCase.price; b.textContent = "Öffnen – " + money(currentCase.price); }
}

/* ==========================================================================
   Case öffnen
   ========================================================================== */
function spin(c, drop, fast) {
  return new Promise(resolve => {
    const track = $("#track"), vp = track.parentElement;
    const N = 70, W = 58;
    track.innerHTML = Array.from({ length: N }, (_, i) => cardHTML(i === W ? drop : randomDisplay(c))).join("");
    track.style.transform = "translateX(0)";
    const vw = vp.clientWidth;
    const CARD = track.children[1].offsetLeft - track.children[0].offsetLeft;
    const jitter = (Math.random() - 0.5) * CARD * 0.7;
    const target = -(W * CARD + CARD / 2 + jitter) + vw / 2;
    const dur = fast ? 700 : CONFIG.rouletteMs, t0 = performance.now();
    let last = -1;
    (function frame(now) {
      const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 4), x = target * e;
      track.style.transform = `translateX(${x}px)`;
      const idx = Math.floor((-x + vw / 2) / CARD);
      if (idx !== last) { last = idx; if (!fast) beep(560 + (idx % 3) * 50, 0.04, 0.03); }
      if (p < 1) requestAnimationFrame(frame); else resolve();
    })(t0);
  });
}

async function doOpen() {
  if (busy || !currentCase) return;
  const c = currentCase;
  if (!c.free && state.balance + 1e-9 < c.price) return toast("Nicht genug Guthaben.");
  busy = true; $("#openBtn").disabled = true;
  if (!c.free) state.balance = round2(state.balance - c.price);
  const drop = makeDrop(c);
  state.pending = drop;           // falls die Seite während der Animation neu geladen wird, geht nichts verloren
  save();
  await spin(c, drop, $("#fast").checked);
  if ($("#auto").checked && drop.tier === "milspec") {       // Auto-Verkauf nur für blaue Skins
    state.balance = round2(state.balance + drop.price); state.pending = null; save();
    toast("Verkauft: " + fullName(drop) + " (+" + money(drop.price) + ")");
  } else showResult(drop);
  busy = false; refreshBtn();
}

function showResult(d) {
  const col = TIER[d.tier].color;
  $("#resultBox").innerHTML = `
    <div class="rarity-line" style="--c:${col}">${d.tier === "gold" ? "Seltener Spezialgegenstand" : TIER[d.tier].label}</div>
    ${imgTag(d.image)}
    <h3 style="margin:8px 0 4px">${esc(fullName(d))}</h3>
    <div class="sub" style="margin:0">${d.float != null ? "Float " + d.float.toFixed(6) : "Vanilla"}</div>
    <div class="price" style="font-size:22px;margin-top:8px">${money(d.price)}</div>
    <div class="actions">
      <button class="btn sell" data-action="rsell">Verkaufen</button>
      <button class="btn" data-action="rkeep">Behalten</button>
    </div>`;
  $("#resultBox").style.boxShadow = `0 0 40px ${col}55`;
  $("#resultBox").style.borderColor = col;
  $("#resultModal").classList.add("show");
  winSound(d.tier);
}
function closeResult(sell) {
  const d = state.pending; if (!d) return;
  if (sell) { state.balance = round2(state.balance + d.price); toast("Verkauft für " + money(d.price)); }
  else { state.inventory.push(d); toast("Ins Inventar gelegt"); }
  state.pending = null; save();
  $("#resultModal").classList.remove("show");
  refreshBtn();
  if (view === "inventory") renderInventory();
}

/* ==========================================================================
   Events (Delegation)
   ========================================================================== */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]"); if (!el) return;
  const a = el.dataset.action;
  if ((busy||upgradeBusy) && ["nav", "back", "opencase","selectfrom","selectto"].includes(a)) return;
  switch (a) {
    case "nav": view = el.dataset.view; render(); break;
    case "selectfrom": upFrom=el.dataset.uid; renderUpgrader(); break;
    case "selectto": upTo=el.dataset.uid; renderUpgrader(); break;
    case "upgrade": runUpgrade(); break;
    case "inspect": { const d=state.inventory.find(x=>x.uid===el.dataset.uid); if(d) inspectItem(d); break; }
    case "closeinspect": closeInspect(); break;
    case "panic": setPanic(true); break;
    case "back": view = "cases"; render(); break;
    case "opencase": renderCase(el.dataset.case === "__free" ? freeCaseObj() : CASES[+el.dataset.case]); window.scrollTo(0, 0); break;
    case "open": doOpen(); break;
    case "sell": {
      const i = state.inventory.findIndex(x => x.uid === el.dataset.uid);
      if (i > -1) { state.balance = round2(state.balance + state.inventory[i].price); state.inventory.splice(i, 1); save(); renderInventory(); }
      break;
    }
    case "sellall": {
      const f = window._invFilter || "all";
      const sel = state.inventory.filter(i => f === "all" || i.tier === f);
      if (!sel.length || !confirm(sel.length + " Items verkaufen?")) break;
      state.balance = round2(state.balance + sel.reduce((s, i) => s + i.price, 0));
      state.inventory = state.inventory.filter(i => !sel.includes(i));
      save(); renderInventory(); break;
    }
    case "rsell": closeResult(true); break;
    case "rkeep": closeResult(false); break;
    case "mute": state.muted = !state.muted; save(); break;
    case "rename": $("#nameInput").value = state.name; $("#nameModal").classList.add("show"); $("#nameInput").focus(); break;
    case "savename": {
      const n = $("#nameInput").value.trim().slice(0, 16);
      if (!n) return toast("Bitte einen Namen eingeben.");
      state.name = n; save(); $("#nameModal").classList.remove("show"); break;
    }
    case "retry": init(); break;
  }
});
function setPanic(on){state.panic=on;try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}document.body.classList.toggle("panic",on);document.title=on?"Freischaltcode":"CS2 Case Simulator";if(on)setTimeout(()=>$("#panicCode").focus(),0);}
$("#panicForm").addEventListener("submit",e=>{e.preventDefault();if($("#panicCode").value==="1234"){setPanic(false);$("#panicCode").value="";$("#panicError").textContent="";}else{$("#panicError").textContent="Code nicht korrekt.";$("#panicCode").select();}});
$("#inspectModal").addEventListener("click",e=>{if(e.target.id==="inspectModal")closeInspect();});document.addEventListener("keydown",e=>{if(e.key==="Escape")closeInspect();});

document.addEventListener("change", e => {
  if (e.target.id === "fast") { state.fast = e.target.checked; save(); }
  if (e.target.id === "auto") { state.autoSell = e.target.checked; save(); }
});
$("#nameInput").addEventListener("keydown", e => { if (e.key === "Enter") document.querySelector('[data-action="savename"]').click(); });

/* ==========================================================================
   Start
   ========================================================================== */
let DATA = null;
async function init() {
  $("#view").innerHTML = `<div class="center">Lade Case-Daten …</div>`;
  try {
    DATA = await loadData();
    CASES = buildCases(DATA);
    if (!CASES.length) throw new Error("Keine Cases gefunden");
  } catch (err) {
    console.error(err);
    $("#view").innerHTML = `<div class="center">Die Case-Daten konnten nicht geladen werden (${esc(err.message)}).<br>
      Prüfe deine Internetverbindung.<br><br><button class="btn primary" data-action="retry">Erneut versuchen</button></div>`;
    return;
  }
  render();
  if (!state.name) $("#nameModal").classList.add("show");
  else refreshLeaderboard();
  if (state.pending) showResult(state.pending);   // unterbrochene Öffnung wiederherstellen
}
updateHeader();
if(state.panic)setPanic(true);
init();
</script>
</body>
